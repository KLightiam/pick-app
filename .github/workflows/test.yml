name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pick
          POSTGRES_PASSWORD: pick
          POSTGRES_DB: pick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pick:pick@localhost:5432/pick
      TEST_DATABASE_URL: postgres://pick:pick@localhost:5432/pick
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @pick/admin build
